on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'gluonhq/gluon-samples'
          ref: 'f75e9c3c0dda8170ee318ae42377c4549ca0ef3d'
      - uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
          arch: aarch64
      - working-directory: ./HelloGluon
        run: mvn -Pios gluonfx:build
